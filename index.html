<script>
'use strict';
const $=id=>document.getElementById(id),normalize=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
let products=JSON.parse($('initial-data').textContent);
function options(id,values,placeholder){const el=$(id),old=el.value;el.replaceChildren(new Option(placeholder,''));const seen=new Map();values.filter(Boolean).forEach(v=>{v=v.trim();if(!seen.has(normalize(v)))seen.set(normalize(v),v)});[...seen.values()].sort((a,b)=>a.localeCompare(b,'fi')).forEach(v=>el.add(new Option(v,v)));if([...el.options].some(o=>o.value===old))el.value=old;}
function models(){options('model',products.filter(p=>!$('brand').value||normalize(p.Merkki)===normalize($('brand').value)).map(p=>p.Malli),'Kaikki mallit');}
function initialize(){options('brand',products.map(p=>p.Merkki),'Kaikki merkit');models();options('position',products.map(p=>p.Sijainti),'Etu ja taka');render();}
function textEl(tag,text,cls){const el=document.createElement(tag);el.textContent=text||'—';if(cls)el.className=cls;return el;}
function safeImage(path){path=String(path||'').trim().replace(/\\/g,'/');return /^kuvat\/[A-Za-z0-9_.-]+\.(png|jpe?g|webp|gif)$/i.test(path)?path:'';}
function filtered(){const words=normalize($('query').value).split(/\s+/).filter(Boolean);return products.filter(p=>(!$('brand').value||normalize(p.Merkki)===normalize($('brand').value))&&(!$('model').value||normalize(p.Malli)===normalize($('model').value))&&(!$('position').value||normalize(p.Sijainti)===normalize($('position').value))&&words.every(w=>normalize(Object.values(p).join(' ')).includes(w)));}
function render(){const list=filtered();$('count').textContent=`${list.length} / ${products.length} tuotetta`;$('empty').hidden=list.length>0;$('grid').replaceChildren();for(const p of list){const card=textEl('article','', 'card');card.textContent='';const photo=document.createElement('button');photo.className='photo';const path=safeImage(p.Kuvatiedosto);if(path){const img=document.createElement('img');img.src=path;img.alt=p.Nimi||`${p.Merkki} ${p.Malli}`;img.loading='lazy';img.onerror=()=>{photo.replaceChildren(textEl('span','Kuvaa ei löydy'));photo.disabled=true;};photo.append(img);photo.setAttribute('aria-label',`Suurenna kuva: ${img.alt}`);photo.onclick=()=>{$('viewer').querySelector('img').src=path;$('caption').textContent=`${p.Nimi||p.Malli} · ${p['Uusi tuotekoodi']}`;$('viewer').showModal();};}else{photo.textContent='Ei kuvaa';photo.disabled=true;}const info=document.createElement('div');info.className='info';info.append(textEl('span',p.Sijainti,'pill'),textEl('h2',p.Nimi||`${p.Merkki} ${p.Malli}`),textEl('div',p.Vuosimalli,'years'));const dl=document.createElement('dl');for(const [label,value,cls] of [['Tuotekoodi',p['Uusi tuotekoodi'],'code'],['Hinta',p['Hinta (€)'] ? p['Hinta (€)']+' €' : 'Ei määritetty','']])dl.append(textEl('dt',label),textEl('dd',value,cls));info.append(dl);card.append(photo,info);$('grid').append(card);}}
$('query').addEventListener('input',render);$('brand').onchange=()=>{ $('model').value='';models();render();};$('model').onchange=render;$('position').onchange=render;$('clear').onclick=()=>{for(const id of ['query','brand','model','position'])$(id).value='';models();render();};$('viewer').querySelector('button').onclick=()=>$('viewer').close();$('viewer').onclick=e=>{if(e.target===$('viewer'))$('viewer').close();};
initialize();$('status').textContent='Julkaistu tuoteluettelo.';
</script></html>
